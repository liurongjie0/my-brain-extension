services:
  mysql:
    image: mysql:8.0
    container_name: agent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: agent_platform
      MYSQL_USER: agent
      MYSQL_PASSWORD: agent123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-stack:
    image: redis/redis-stack:latest
    container_name: agent-redis
    restart: unless-stopped
    ports:
      # 宿主用 6380 避开常见的 6379 占用(如本机其它 redis/langfuse); 容器内仍是 6379
      - "6380:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
